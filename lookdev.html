<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Look Development</title>
    <style>
      body { margin: 0; overflow: hidden; background: #a9d2f2; font: 14px/1.4 system-ui, sans-serif; }
      canvas { display: block; touch-action: none; }
      #panel {
        position: fixed; top: 16px; left: 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
        max-width: calc(100vw - 64px); padding: 10px 14px; border-radius: 12px; color: #fff; background: rgba(28, 38, 64, 0.82);
      }
      label { display: flex; gap: 6px; align-items: center; }
    </style>
  </head>
  <body>
    <div id="panel">
      <label>Model <select id="model"></select></label>
      <label>Frosting <select id="frost"></select></label>
      <label>Daylight <input id="daylight" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <label><input id="spin" type="checkbox" checked /> Spin</label>
    </div>
    <script type="module" src="/src/lookdev.js"></script>
  </body>
</html>
